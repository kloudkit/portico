---
version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/kloudkit/portico/cmd.version={{ .Version }}

archives:
  - formats:
      - binary
    name_template: "{{ .ProjectName }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true
